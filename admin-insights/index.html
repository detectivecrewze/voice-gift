<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Insights | For you, Always.</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif:italic&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg-main: #fcfaf7;
            --text-main: #111111;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
        }

        .italic-title {
            font-family: 'Instrument Serif', serif;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 163, 115, 0.1);
            border-radius: 24px;
            box-shadow: 0 20px 40px -15px rgba(212, 163, 115, 0.05);
        }

        .header-gradient {
            background: linear-gradient(to bottom, #ffffff, transparent);
        }

        .status-badge {
            font-size: 8px;
            padding: 2px 8px;
            border-radius: 99px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 700;
        }

        .status-published {
            background: #ecfdf5;
            color: #059669;
        }

        .status-draft {
            background: #fef3c7;
            color: #d97706;
        }

        tr {
            transition: all 0.2s ease;
            border-bottom: 1px solid rgba(0, 0, 0, 0.02);
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .grain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }
    </style>
</head>

<body class="p-8 md:p-12">
    <div class="grain"></div>

    <div class="max-w-6xl mx-auto">
        <header class="mb-12 flex flex-col md:flex-row justify-between md:items-end gap-6">
            <div>
                <h1 class="text-4xl italic-title">Admin Insights</h1>
                <p class="text-[10px] uppercase tracking-[0.4em] text-gray-500 mt-2">Live Tracking & Database</p>
            </div>
            <div id="auth-section" class="flex items-center gap-4 w-full md:w-auto">
                <input id="admin-secret" type="password" placeholder="Admin Secret"
                    class="bg-white border border-gray-100 rounded-full px-4 py-2 text-xs focus:outline-none focus:border-[#d4a373] transition-all flex-grow md:flex-grow-0">
                <button id="btn-refresh"
                    class="bg-black text-white text-[10px] uppercase tracking-widest px-6 py-2.5 rounded-full hover:bg-gray-800 transition-all font-bold whitespace-nowrap">
                    Refresh Data
                </button>
            </div>
        </header>

        <div class="glass-card overflow-x-auto">
            <table class="w-full text-left border-collapse min-w-[800px]">
                <thead>
                    <tr class="bg-white/50">
                        <th class="p-6 text-[10px] uppercase tracking-widest text-gray-400 font-bold whitespace-nowrap">
                            Gift ID / URL</th>
                        <th class="p-6 text-[10px] uppercase tracking-widest text-gray-400 font-bold whitespace-nowrap">
                            Penerima</th>
                        <th class="p-6 text-[10px] uppercase tracking-widest text-gray-400 font-bold whitespace-nowrap">
                            Tema & Audio</th>
                        <th class="p-6 text-[10px] uppercase tracking-widest text-gray-400 font-bold whitespace-nowrap">
                            Konten</th>
                        <th class="p-6 text-[10px] uppercase tracking-widest text-gray-400 font-bold whitespace-nowrap">
                            Tanggal Publish</th>
                        <th class="p-6 text-[10px] uppercase tracking-widest text-gray-400 font-bold whitespace-nowrap">
                            Aksi</th>
                    </tr>
                </thead>
                <tbody id="gift-table-body">
                    <!-- Data loaded via JS -->
                    <tr>
                        <td colspan="5" class="p-12 text-center text-gray-400 text-xs italic">Silahkan masukkan Admin
                            Secret dan klik Refresh.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <footer class="mt-12 flex justify-between items-center opacity-30">
            <p class="text-[9px] uppercase tracking-widest">© 2026 FOR YOU, ALWAYS.</p>
            <div class="h-px bg-gray-300 flex-grow mx-8"></div>
            <p class="text-[9px] uppercase tracking-widest font-bold">Admin Panel v1.0</p>
        </footer>
    </div>

    <script src="admin.js"></script>
</body>

</html>
