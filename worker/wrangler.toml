# ============================================================
# For you, Always. — Cloudflare Worker Configuration
# ============================================================
# SEBELUM DEPLOY:
# 1. Ganti [KV_NAMESPACE_ID] dengan ID asli dari:
#    wrangler kv namespace create GIFT_DATA
# 2. Set ADMIN_SECRET via:
#    wrangler secret put ADMIN_SECRET
# ============================================================

name = "for-you-always-api"
main = "worker.js"
compatibility_date = "2024-01-01"

# R2 Bucket — Penyimpanan foto & audio
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "for-you-always-files"

# KV Namespace — Database config studio & gift
[[kv_namespaces]]
binding = "VALENTINE_DATA"
id = "86ef0ba0095c4d9cb428e2959c827812"

# Untuk development lokal (wrangler dev):
# [[kv_namespaces]]
# binding = "GIFT_DATA"
# id = "d9d5a841781244e3ae156a0ba80ac577"
# preview_id = "GANTI_DENGAN_KV_PREVIEW_ID"
