<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voices, Always for you.</title>
    <meta name="description" content="Ada hadiah spesial untukmu" />

    <!-- Prevent indexing oleh search engine -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Open Graph (untuk preview link di WhatsApp) -->
    <meta property="og:title" content="Ada hadiah untukmu 💕" />
    <meta property="og:description" content="Buka untuk melihat hadiah spesial dari seseorang yang menyayangimu." />
    <meta property="og:type" content="website" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <link rel="stylesheet" href="gift/style.css" />
</head>

<body>

    <!-- ============================================
    STATE: LOADING
  ============================================ -->
    <div id="state-loading" class="fullscreen-center">
        <div class="loading-spinner"></div>
    </div>

    <!-- ============================================
    STATE: ERROR
  ============================================ -->
    <div id="state-error" class="fullscreen-center hidden">
        <div class="error-container">
            <span class="error-icon">💔</span>
            <h2>Gift tidak ditemukan</h2>
            <p>Link ini mungkin salah atau sudah tidak aktif.</p>
        </div>
    </div>

    <!-- ============================================
    STATE: GIFT PAGE (konten utama)
    Root index.html difokuskan sebagai preview demo.
  ============================================ -->
    <div id="state-gift" class="hidden" data-theme="rose">

        <!-- VOICE NOTE SECTION (dirender oleh player.js jika ada) -->
        <section id="gift-voice" class="voice-section fade-in-up hidden" style="--delay: 0.3s">
            <!-- Diisi oleh player.js -->
        </section>

        <!-- FLOATING BRAND BADGE -->
        <a href="https://for-you-always.my.id" class="watermark-badge" target="_blank"
            title="Buat gift-mu di For you, Always.">
            <div class="flex items-center gap-2">
                <span class="material-symbols-outlined scale-75" style="font-variation-settings: 'FILL' 1, 'wght' 700;">
                    diamond
                </span>
                <span class="font-bold uppercase tracking-widest text-xs opacity-90">
                    FOR YOU, ALWAYS
                </span>
            </div>
        </a>
    </div>

    <!-- Scripts -->
    <script src="gift/js/player.js"></script>
    <script src="gift/js/gallery.js"></script>
    <script src="gift/js/gift.js"></script>

</body>

</html>
