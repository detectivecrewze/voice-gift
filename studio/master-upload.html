<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Asset Uploader — Voices.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:italic&family=Inter:wght@300;400;600&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background: #fcfaf7;
        }

        .text-serif {
            font-family: 'Instrument+Serif', serif;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>

<body class="min-h-screen py-20 px-6">
    <div class="max-w-xl mx-auto">
        <header class="text-center mb-16">
            <h1 class="text-5xl text-serif italic mb-4">Master Uploader</h1>
            <p class="text-[10px] uppercase tracking-[0.4em] text-gray-400">Migrasi Aset ke Cloudflare R2</p>
        </header>

        <div class="glass-card rounded-3xl p-8 shadow-sm">
            <div id="dropzone"
                class="border-2 border-dashed border-gray-100 rounded-2xl p-12 text-center hover:border-[#d4a373] transition-all cursor-pointer bg-gray-50/30">
                <p class="text-[11px] uppercase tracking-widest text-gray-500 mb-2">Pilih atau Seret File ke Sini</p>
                <p class="text-[9px] text-gray-400 uppercase tracking-widest">(MP3, M4A, JPG, PNG, dll)</p>
                <input type="file" id="fileInput" class="hidden" multiple>
            </div>

            <div id="uploadList" class="mt-8 space-y-3">
                <!-- Upload items will appear here -->
            </div>
        </div>

        <div class="mt-8 text-center">
            <a href="/studio/"
                class="text-[10px] uppercase tracking-widest text-gray-400 hover:text-black transition-colors">← Kembali
                ke Studio</a>
        </div>
    </div>

    <script>
        const API_URL = 'https://valentine-upload.aldoramadhan16.workers.dev/upload';
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const uploadList = document.getElementById('uploadList');

        dropzone.onclick = () => fileInput.click();

        fileInput.onchange = (e) => handleFiles(e.target.files);

        dropzone.ondragover = (e) => { e.preventDefault(); dropzone.classList.add('border-[#d4a373]'); };
        dropzone.ondragleave = () => dropzone.classList.remove('border-[#d4a373]');
        dropzone.ondrop = (e) => {
            e.preventDefault();
            dropzone.classList.remove('border-[#d4a373]');
            handleFiles(e.dataTransfer.files);
        };

        async function handleFiles(files) {
            for (const file of files) {
                const item = createUploadItem(file.name);
                uploadList.prepend(item);

                try {
                    const formData = new FormData();
                    formData.append('file', file);

                    const response = await fetch(API_URL, {
                        method: 'POST',
                        body: formData
                    });

                    if (!response.ok) throw new Error('Full disk or server error');

                    const result = await response.json();
                    if (result.success) {
                        finalizeItem(item, result.url);
                    } else {
                        throw new Error(result.error);
                    }
                } catch (err) {
                    failItem(item, err.message);
                }
            }
        }

        function createUploadItem(name) {
            const div = document.createElement('div');
            div.className = 'p-4 bg-white border border-gray-50 rounded-xl flex items-center justify-between animate-in fade-in slide-in-from-top-1 duration-300';
            div.innerHTML = `
                <div class="flex-1 pr-4">
                    <p class="text-[10px] font-bold text-gray-700 truncate">${name}</p>
                    <div class="h-1 bg-gray-100 rounded-full mt-2 relative overflow-hidden">
                        <div class="absolute inset-0 bg-[#d4a373] animate-pulse" style="width: 50%"></div>
                    </div>
                </div>
                <span class="text-[8px] uppercase tracking-widest text-gray-400">Uploading...</span>
            `;
            return div;
        }

        function finalizeItem(item, url) {
            item.innerHTML = `
                <div class="flex-1 pr-4">
                    <p class="text-[10px] font-bold text-gray-700 truncate">${item.querySelector('p').textContent}</p>
                    <p class="text-[9px] text-green-500 mt-1 truncate select-all">${url}</p>
                </div>
                <button onclick="copyToClipboard('${url}', this)" class="text-[9px] uppercase tracking-widest font-bold bg-[#d4a373] text-white px-3 py-1.5 rounded-lg hover:bg-black transition-all">Copy Link</button>
            `;
        }

        function failItem(item, msg) {
            item.innerHTML = `
                <div class="flex-1 pr-4">
                    <p class="text-[10px] font-bold text-gray-700 truncate">${item.querySelector('p').textContent}</p>
                    <p class="text-[9px] text-rose-500 mt-1 font-medium">${msg}</p>
                </div>
                <span class="text-[9px] uppercase tracking-widest text-rose-400 font-bold">Failed</span>
            `;
        }

        function copyToClipboard(text, btn) {
            navigator.clipboard.writeText(text);
            const original = btn.textContent;
            btn.textContent = 'Copied!';
            btn.classList.replace('bg-[#d4a373]', 'bg-black');
            setTimeout(() => {
                btn.textContent = original;
                btn.classList.replace('bg-black', 'bg-[#d4a373]');
            }, 2000);
        }
    </script>
</body>

</html>
